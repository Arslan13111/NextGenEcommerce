<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Confirmed - NextGen E-Commerce</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            color: #ffffff;
            overflow: hidden;
        }

        .background-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
        }

        .glow-1 {
            top: -100px;
            right: -100px;
            background: #6c63ff;
        }

        .glow-2 {
            bottom: -100px;
            left: -100px;
            background: #00c9a7;
        }

        .container {
            text-align: center;
            padding: 48px 32px;
            max-width: 520px;
            width: 90%;
            position: relative;
            z-index: 1;
        }

        .checkmark-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c9a7 0%, #00b894 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            box-shadow: 0 0 60px rgba(0, 201, 167, 0.3);
            animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }

        .checkmark-circle svg {
            width: 56px;
            height: 56px;
            stroke: #ffffff;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .checkmark-path {
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: drawCheck 0.5s 0.5s ease forwards;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            animation: fadeUp 0.6s 0.3s ease forwards;
            opacity: 0;
        }

        .subtitle {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            margin-bottom: 36px;
            animation: fadeUp 0.6s 0.5s ease forwards;
            opacity: 0;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            margin: 0 auto 36px;
            animation: fadeUp 0.6s 0.6s ease forwards;
            opacity: 0;
        }

        .brand-section {
            animation: fadeUp 0.6s 0.7s ease forwards;
            opacity: 0;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .brand-tagline {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
        }

        .message-box {
            margin-top: 36px;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            animation: fadeUp 0.6s 0.9s ease forwards;
            opacity: 0;
        }

        .message-box p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
        }

        .footer {
            margin-top: 48px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            animation: fadeUp 0.6s 1.1s ease forwards;
            opacity: 0;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.3);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes drawCheck {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes fadeUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>

    <div class="container">
        <div class="checkmark-circle">
            <svg viewBox="0 0 52 52">
                <path class="checkmark-path" d="M14 27l8 8 16-16" />
            </svg>
        </div>

        <h1 class="title">Thank You!</h1>
        <p class="subtitle">Your email has been successfully confirmed.</p>

        <div class="divider"></div>

        <div class="brand-section">
            <div class="brand-name">NextGen</div>
            <div class="brand-tagline">E-Commerce</div>
        </div>

        <div class="message-box">
            <p>Your account is now fully activated. You can close this page and open the NextGen E-Commerce app to start shopping!</p>
        </div>

        <div class="footer">
            &copy; 2026 NextGen E-Commerce Store. All rights reserved.
        </div>
    </div>
</body>
</html>
